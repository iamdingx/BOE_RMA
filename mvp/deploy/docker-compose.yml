services:
  mysql:
    image: mysql:8.0
    container_name: rma-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rma_root_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rma}
      MYSQL_USER: ${MYSQL_USER:-rma}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rma_pwd}
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../db/enum_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-rma_root_pwd}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [rma]

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: rma-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks: [rma]

  rma-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: boe-rma-api:${TAG:-1.0.0}
    container_name: rma-api
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      minio: { condition: service_started }
    environment:
      APP_PORT: "8080"
      DB_DIALECT: mysql
      DB_DSN: "${MYSQL_USER:-rma}:${MYSQL_PASSWORD:-rma_pwd}@tcp(mysql:3306)/${MYSQL_DATABASE:-rma}?charset=utf8mb4&parseTime=True&loc=Local"
      TENANT_ID: BOE_US
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: rma-photos
      MINIO_USE_SSL: "false"
      TZ: Asia/Shanghai
    expose: ["8080"]
    networks: [rma]

  rma-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: boe-rma-web:${TAG:-1.0.0}
    container_name: rma-web
    restart: unless-stopped
    depends_on: [rma-api]
    ports:
      - "${WEB_PORT:-8088}:80"
    networks: [rma]

volumes:
  mysql-data:
  minio-data:

networks:
  rma:
    driver: bridge
